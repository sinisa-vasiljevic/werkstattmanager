<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b63ce"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Werkstatt"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Werkstattmanager</title>
<style>
:root{--b:#0b63ce;--bg:#eef2f7;--card:#fff;--txt:#111827;--mut:#64748b;--red:#dc2626;--green:#059669;--vio:#6d28d9;--amber:#d97706}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:84px}header{position:sticky;top:0;z-index:20;background:#07111ff2;color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 14px #0003}header small{color:#60a5fa;font-weight:800;letter-spacing:.12em}h1{font-size:20px;margin:2px 0}.wrap{max-width:900px;margin:auto;padding:16px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:1px solid #dbe2ea;padding-bottom:env(safe-area-inset-bottom)}.tab{border:0;background:none;padding:9px 2px;font-size:10px;color:#64748b}.tab b{display:block;font-size:19px}.tab.on{color:var(--b)}button{font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:#e7edf5;color:#1e293b}.primary{background:var(--b);color:#fff}.danger{background:#fee2e2;color:#991b1b}.wa{background:#10b981;color:white}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 12px #0f172a0d;margin-bottom:12px}.card h3{margin:0 0 5px}.muted{color:var(--mut);font-size:13px}.big{font-size:24px;font-weight:850}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.own{background:#ede9fe;color:#6d28d9}.cust{background:#dbeafe;color:#1d4ed8}.field{display:block;margin-bottom:12px}.field span{display:block;font-size:12px;font-weight:750;color:#475569;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px;background:white;font-size:16px}textarea{min-height:80px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:5px 0 12px}.section-title h2{margin:0}.hide{display:none!important}.modal{position:fixed;inset:0;z-index:50;background:#02061799;display:flex;align-items:flex-end}.sheet{background:#f8fafc;width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:#f8fafc;padding:12px 0;z-index:2}.x{border:0;background:#e2e8f0;border-radius:50%;width:36px;height:36px;font-size:20px}.tuv{border-left:5px solid}.black{border-color:#111827;background:#f1f5f9}.red{border-color:#ef4444;background:#fef2f2}.yellow{border-color:#f59e0b;background:#fffbeb}.green{border-color:#10b981;background:#ecfdf5}.search{margin-bottom:12px}.line{border-top:1px solid #e2e8f0;margin:12px 0}.check{display:flex;align-items:center;gap:10px;padding:12px;background:white;border-radius:12px;margin-bottom:7px}.check input{width:22px;height:22px}.notice{padding:12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:13px}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.costrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e2e8f0}.costrow:last-child{border:0}@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.sheet{max-width:650px;margin:auto;border-radius:24px}.modal{align-items:center;padding:18px}.tabs{position:sticky;bottom:0;max-width:900px;margin:auto;border-radius:16px 16px 0 0}}
</style></head><body><header><div><div class="row" style="gap:8px"><small>WERKSTATTMANAGER</small><span style="font-size:11px;font-weight:800;background:#0b63ce;color:white;padding:3px 7px;border-radius:999px">Version 2.1</span></div><h1 id="companyTitle">Meine Werkstatt</h1></div><button class="btn primary" onclick="openQuick()">＋ Neu</button></header><main class="wrap" id="app"></main><nav class="tabs" id="tabs"></nav><div id="modal"></div>
<script>
const KEY='werkstattmanager-pwa-v1';
const defaults={settings:{company:'Meine Werkstatt',hourlyRate:50,dueWindow:90,redDays:14,yellowDays:60,rounding:'none'},customers:[],vehicles:[],categories:[{id:'cat_service',name:'Service'},{id:'cat_bremsen',name:'Bremsen'}],services:[{id:'s_oel',categoryId:'cat_service',name:'Ölwechsel mit Filter',price:70,partsCost:42},{id:'s_luft',categoryId:'cat_service',name:'Luftfilterwechsel',price:15,partsCost:8}],materials:[{id:'mat_oel',name:'Motoröl 5W-30',manufacturer:'',partNumber:'',approval:'VW 504 00 / 507 00',unit:'Liter',unitCost:10.99},{id:'mat_oelfilter',name:'Ölfilter',manufacturer:'MANN-FILTER',partNumber:'',approval:'',unit:'Stück',unitCost:9.50}],costCategories:[{id:'cc_service',name:'Service & Wartung'},{id:'cc_rep',name:'Reparatur'},{id:'cc_tuv',name:'TÜV & AU'},{id:'cc_reifen',name:'Reifen'},{id:'cc_vers',name:'Versicherung'},{id:'cc_steuer',name:'Kfz-Steuer'},{id:'cc_pflege',name:'Pflege & Zubehör'},{id:'cc_sonst',name:'Sonstiges'}],entries:[]};
let db=load(),tab='dash',vehicleFilter='all'; const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7); const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0)); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const todayISO=()=>{const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}; const monthValue=d=>d?String(d).slice(0,7):''; const monthEnd=m=>{if(!m)return '';const [y,mo]=m.split('-').map(Number),d=new Date(y,mo,0);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const serviceValue=(v,s,key)=>{const val=v?.priceOverrides?.[s.id]?.[key];return val===null||val===undefined||val===''?Number(s[key]||0):Number(val)};
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}} function save(){localStorage.setItem(KEY,JSON.stringify(db));document.querySelector('#companyTitle').textContent=db.settings.company;render()};
const tabs=[['dash','⌂','Übersicht'],['customers','♙','Kunden'],['vehicles','▣','Fahrzeuge'],['services','🔧','Leistungen'],['orders','▤','Aufträge'],['costs','▥','Kosten'],['settings','⚙','Optionen']];
function render(){document.querySelector('#companyTitle').textContent=db.settings.company;document.querySelector('#tabs').innerHTML=tabs.map(x=>`<button class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelector('#app').innerHTML=({dash:dashboard,customers:customersPage,vehicles:vehiclesPage,services:servicesPage,orders:ordersPage,costs:costsPage,settings:settingsPage}[tab])();}
function customer(cid){return db.customers.find(x=>x.id===cid)} function vehicle(vid){return db.vehicles.find(x=>x.id===vid)} function category(cid){return db.costCategories.find(x=>x.id===cid)}
function daysUntil(d){if(!d)return null;let a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(d+'T00:00:00')-a)/86400000)}
function dashboard(){let due=db.vehicles.map(v=>({...v,days:daysUntil(v.tuv)})).filter(v=>v.days!==null&&v.days<=db.settings.dueWindow).sort((a,b)=>a.days-b.days);let own=db.vehicles.filter(v=>v.type==='own').length;return `<div class="grid g4">${stat('Kunden',db.customers.length)}${stat('Eigene Fzg.',own)}${stat('Kunden-Fzg.',db.vehicles.length-own)}${stat('TÜV fällig',due.length)}</div><div class="section-title"><div><h2>TÜV bald fällig</h2><div class="muted">Nächste ${db.settings.dueWindow} Tage</div></div></div>${due.length?due.map(v=>{let c=customer(v.customerId),cl=v.days<0?'black':v.days<=db.settings.redDays?'red':v.days<=db.settings.yellowDays?'yellow':'green',dot=v.days<0?'⚫':v.days<=db.settings.redDays?'🔴':v.days<=db.settings.yellowDays?'🟡':'🟢',txt=v.days<0?`seit ${Math.abs(v.days)} Tagen abgelaufen`:v.days===0?'heute fällig':`in ${v.days} Tagen`;return `<div class="card tuv ${cl}"><h3>${dot} ${esc(v.make)} ${esc(v.model)}</h3><div class="muted">(${v.type==='own'?'Eigenes Fahrzeug':esc(c?.name||'Kein Kunde')})</div><p><b>TÜV ${txt}</b></p><div class="muted">${esc(v.plate||'Kein Kennzeichen')} · ${new Date(v.tuv+'T00:00:00').toLocaleDateString('de-DE')}</div>${v.type!=='own'&&c?.phone?`<button class="btn wa" style="margin-top:12px" onclick="sendTuv('${v.id}')">WhatsApp</button>`:''}</div>`}).join(''):'<div class="card muted">Kein TÜV im gewählten Zeitraum.</div>'}`}
function stat(l,n){return `<div class="card"><div class="big">${n}</div><div class="muted"><b>${l}</b></div></div>`}
function customersPage(){return `<div class="section-title"><h2>Kunden</h2><button class="btn primary" onclick="editCustomer()">＋ Kunde</button></div><input class="search" id="search" placeholder="Kunde suchen" oninput="filterCards(this.value)"><div id="cardlist">${db.customers.map(c=>`<div class="card searchable"><div class="row between"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.phone||'Keine Telefonnummer')}</div><div class="muted">${db.vehicles.filter(v=>v.customerId===c.id&&v.type!=='own').length} Fahrzeug(e)</div></div><button class="btn" onclick="editCustomer('${c.id}')">Bearbeiten</button></div></div>`).join('')||'<div class="card muted">Noch keine Kunden.</div>'}</div>`}
function vehiclesPage(){let list=db.vehicles.filter(v=>vehicleFilter==='all'||v.type===vehicleFilter);return `<div class="section-title"><h2>Fahrzeuge</h2><button class="btn primary" onclick="editVehicle()">＋ Fahrzeug</button></div><div class="grid g3" style="margin-bottom:12px">${[['all','Alle'],['own','Eigene'],['customer','Kunden-Fzg.']].map(x=>`<button class="btn ${vehicleFilter===x[0]?'primary':''}" onclick="vehicleFilter='${x[0]}';render()">${x[1]}</button>`).join('')}</div><input class="search" placeholder="Fahrzeug suchen" oninput="filterCards(this.value)"><div id="cardlist" class="grid g2">${list.map(v=>`<div class="card searchable"><span class="pill ${v.type==='own'?'own':'cust'}">${v.type==='own'?'Eigenes Fahrzeug':'Kundenfahrzeug'}</span><h3>${esc(v.make)} ${esc(v.model)}</h3><div class="muted">${v.type==='own'?'Eigener Bestand':esc(customer(v.customerId)?.name||'Kein Kunde')}</div><p>${esc(v.plate||'Kein Kennzeichen')}</p><div class="muted">HSN ${esc(v.hsn||'–')} · TSN ${esc(v.tsn||'–')} · ${esc(v.mileage||0)} km</div><button class="btn" style="margin-top:12px" onclick="editVehicle('${v.id}')">Bearbeiten</button></div>`).join('')||'<div class="card muted">Keine Fahrzeuge.</div>'}</div>`}
function servicesPage(){return `<div class="section-title"><div><h2>Leistungen</h2><div class="muted">Verkaufspreise und Teilekosten</div></div><button class="btn" onclick="editServiceCategory()">＋ Kategorie</button></div>${db.categories.map(c=>`<div class="card"><div class="row between"><h3>${esc(c.name)}</h3><button class="btn primary" onclick="editService('', '${c.id}')">＋</button></div><div class="line"></div>${db.services.filter(s=>s.categoryId===c.id).map(s=>`<div class="costrow"><div><b>${esc(s.name)}</b><div class="muted">VK ${euro(s.price)} · Teile ${euro(s.partsCost)} · Ertrag ${euro(s.price-s.partsCost)}</div></div><button class="btn" onclick="editService('${s.id}')">Bearbeiten</button></div>`).join('')||'<div class="muted">Keine Leistungen.</div>'}</div>`).join('')}<div class="section-title"><div><h2>Materialdatenbank</h2><div class="muted">Öle, Filter, Teile und Freigaben · <button class="btn" style="padding:4px 8px;margin-top:4px" onclick="exportMaterialTemplate()">CSV-Vorlage</button></div></div><div class="row"><label class="btn">⇩ Import<input type="file" accept=".csv,.json,text/csv,application/json" hidden onchange="importMaterialsFile(this.files[0]);this.value=''"></label><button class="btn primary" onclick="editMaterial()">＋ Material</button></div></div>${(db.materials||[]).map(m=>`<div class="card"><div class="row between"><div><h3>${esc(m.name)}</h3><div class="muted">${esc(m.manufacturer||'Kein Hersteller')}${m.partNumber?' · '+esc(m.partNumber):''}</div><div class="muted">${m.approval?'Freigabe: '+esc(m.approval)+' · ':''}${euro(m.unitCost)} / ${esc(m.unit||'Stück')}</div></div><button class="btn" onclick="editMaterial('${m.id}')">Bearbeiten</button></div></div>`).join('')||'<div class="card muted">Noch keine Materialien angelegt.</div>'}}`}
function ordersPage(){return `<div class="section-title"><div><h2>Aufträge & Kosten</h2><div class="muted">Kundenumsatz und eigene Fahrzeugkosten</div></div><button class="btn primary" onclick="editEntry()">＋ Neu</button></div>${db.entries.slice().reverse().map(e=>{let v=vehicle(e.vehicleId),own=e.type==='own',cat=category(e.costCategoryId);return `<div class="card"><span class="pill ${own?'own':'cust'}">${own?esc(cat?.name||'Eigene Kosten'):'Kundenauftrag'}</span><h3>${esc(v?.make||'Fahrzeug gelöscht')} ${esc(v?.model||'')}</h3><div class="muted">${own?'Eigenes Fahrzeug':esc(customer(v?.customerId)?.name||'Kein Kunde')} · ${new Date(e.date+'T00:00:00').toLocaleDateString('de-DE')}</div><div class="big" style="margin-top:10px">${euro(own?e.ownCost:e.total)}</div>${e.materials?.length?`<div class="line"></div><div class="muted"><b>Materialien:</b><br>${e.materials.map(m=>`${esc(m.name)} · ${esc(m.manufacturer||'')} ${m.partNumber?'· '+esc(m.partNumber):''} ${m.approval?'· '+esc(m.approval):''} · ${m.quantity} ${esc(m.unit)} · ${euro(m.total)}`).join('<br>')}</div>`:''}${!own?`<div class="muted" style="color:var(--green)">Ertrag: ${euro(e.profit)}</div><button class="btn wa" style="margin-top:10px" onclick="sendOffer('${e.id}')">WhatsApp</button>`:''}</div>`}).join('')||'<div class="card muted">Noch keine Einträge.</div>'}`}
function costsPage(){let own=db.entries.filter(e=>e.type==='own'),cust=db.entries.filter(e=>e.type!=='own'),rev=cust.reduce((a,e)=>a+e.total,0),parts=cust.reduce((a,e)=>a+e.partsCost,0),prof=cust.reduce((a,e)=>a+e.profit,0),ownTotal=own.reduce((a,e)=>a+e.ownCost,0);let cats=db.costCategories.map(c=>({c,total:own.filter(e=>e.costCategoryId===c.id).reduce((a,e)=>a+e.ownCost,0),count:own.filter(e=>e.costCategoryId===c.id).length})).filter(x=>x.count).sort((a,b)=>b.total-a.total);return `<h2>Getrennte Kostenansicht</h2><div class="card"><h3 style="color:var(--b)">Kundenfahrzeuge</h3><div class="grid g3">${moneyStat('Umsatz',rev)}${moneyStat('Teile',parts)}${moneyStat('Ertrag',prof)}</div></div><div class="card"><h3 style="color:var(--vio)">Meine Fahrzeuge</h3><div class="grid g2">${moneyStat('Einträge',own.length,true)}${moneyStat('Gesamtkosten',ownTotal)}</div></div><div class="card"><h3>Kosten nach Kategorien</h3>${cats.map(x=>`<div class="costrow"><div><b>${esc(x.c.name)}</b><div class="muted">${x.count} Einträge</div></div><b>${euro(x.total)}</b></div>`).join('')||'<div class="muted">Noch keine kategorisierten Kosten.</div>'}</div>${db.vehicles.filter(v=>v.type==='own').map(v=>{let es=own.filter(e=>e.vehicleId===v.id);return `<div class="card"><div class="muted" style="color:var(--vio)"><b>EIGENES FAHRZEUG</b></div><h3>${esc(v.make)} ${esc(v.model)}</h3><div class="muted">${es.length} Einträge</div><div class="big">${euro(es.reduce((a,e)=>a+e.ownCost,0))}</div></div>`}).join('')}`}
function moneyStat(l,n,count=false){return `<div class="notice"><div class="muted">${l}</div><b>${count?n:euro(n)}</b></div>`}
function settingsPage(){return `<h2>Einstellungen</h2><div class="card"><label class="field"><span>Werkstattname</span><input value="${esc(db.settings.company)}" onchange="db.settings.company=this.value;save()"></label><label class="field"><span>Standard-Stundenlohn</span><input type="number" value="${db.settings.hourlyRate}" onchange="db.settings.hourlyRate=+this.value;save()"></label><label class="field"><span>TÜV-Anzeigezeitraum in Tagen</span><input type="number" value="${db.settings.dueWindow}" onchange="db.settings.dueWindow=+this.value;save()"></label></div><div class="card"><h3>Kostenkategorien eigene Fahrzeuge</h3><div class="row"><input id="newCostCat" placeholder="Neue Kostenkategorie"><button class="btn primary" onclick="addCostCategory()">＋</button></div><div class="line"></div>${db.costCategories.map(c=>`<div class="costrow"><b>${esc(c.name)}</b><button class="btn danger" onclick="deleteCostCategory('${c.id}')">Löschen</button></div>`).join('')}</div><div class="card"><h3>Datensicherung</h3><button class="btn primary" style="width:100%" onclick="exportBackup()">Backup exportieren</button><label class="btn" style="display:block;text-align:center;margin-top:8px">Backup importieren<input type="file" accept=".json" hidden onchange="importBackup(this.files[0])"></label></div><button class="btn danger" onclick="resetApp()">App zurücksetzen</button>`}
function filterCards(q){document.querySelectorAll('.searchable').forEach(el=>el.classList.toggle('hide',!el.innerText.toLowerCase().includes(q.toLowerCase())))}
function showModal(title,body){document.querySelector('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="x" onclick="closeModal()">×</button></div>${body}</div></div>`} function closeModal(){document.querySelector('#modal').innerHTML=''}
function openQuick(){showModal('Neu anlegen',`<div class="grid"><button class="btn" onclick="closeModal();editCustomer()">Kunde</button><button class="btn" onclick="closeModal();editVehicle()">Fahrzeug</button><button class="btn" onclick="closeModal();editEntry()">Auftrag oder Kosten</button></div>`)}
function editCustomer(cid=''){let c=db.customers.find(x=>x.id===cid)||{};showModal(c.id?'Kunde bearbeiten':'Kunde anlegen',`<label class="field"><span>Name</span><input id="cn" value="${esc(c.name||'')}"></label><label class="field"><span>Telefon / WhatsApp</span><input id="cp" value="${esc(c.phone||'')}"></label><label class="field"><span>E-Mail</span><input id="ce" value="${esc(c.email||'')}"></label><label class="field"><span>Adresse</span><textarea id="ca">${esc(c.address||'')}</textarea></label><button class="btn primary" style="width:100%" onclick="saveCustomer('${cid}')">Speichern</button>`)}
function saveCustomer(cid){let name=cn.value.trim();if(!name)return alert('Name fehlt.');let o={id:cid||id(),name,phone:cp.value,email:ce.value,address:ca.value};db.customers=cid?db.customers.map(x=>x.id===cid?o:x):[...db.customers,o];save();closeModal()}
function editVehicle(vid=''){let v=db.vehicles.find(x=>x.id===vid)||{type:'customer',priceOverrides:{}};let overrides=v.priceOverrides||{};showModal(v.id?'Fahrzeug bearbeiten':'Fahrzeug anlegen',`<div class="grid g2" style="margin-bottom:12px"><button id="vc" class="btn ${v.type!=='own'?'primary':''}" onclick="setVehicleType('customer')">Kundenfahrzeug</button><button id="vo" class="btn ${v.type==='own'?'primary':''}" onclick="setVehicleType('own')">Eigenes Fahrzeug</button></div><input type="hidden" id="vtype" value="${v.type||'customer'}"><div id="customerField" class="${v.type==='own'?'hide':''}"><label class="field"><span>Kunde</span><select id="vcustomer"><option value="">Bitte auswählen</option>${db.customers.map(c=>`<option value="${c.id}" ${v.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>${[['Marke','vmake',v.make,'text'],['Modell','vmodel',v.model,'text'],['Kennzeichen','vplate',v.plate,'text'],['Baujahr','vyear',v.year,'text'],['Tag der Erstzulassung','vfirstreg',v.firstRegistration,'date'],['HSN (zu 2)','vhsn',v.hsn,'text'],['TSN (zu 3)','vtsn',v.tsn,'text'],['Kilometerstand','vkm',v.mileage,'number'],['Motor','vengine',v.engine,'text']].map(x=>`<label class="field"><span>${x[0]}</span><input type="${x[3]}" id="${x[1]}" value="${esc(x[2]||'')}"></label>`).join('')}<label class="field"><span>Fahrgestellnummer</span><input id="vvin" value="${esc(v.vin||'')}"></label><label class="field"><span>TÜV / HU bis (Monat und Jahr)</span><input type="month" id="vtuvmonth" value="${monthValue(v.tuv)}"><small class="muted">Gespeichert wird automatisch der letzte Tag des Monats.</small></label><label class="field"><span>Notizen</span><textarea id="vnotes">${esc(v.notes||'')}</textarea></label><div class="card" style="box-shadow:none;border:1px solid #dbe2ea"><h3>Fahrzeugindividuelle Preise</h3><div class="muted" style="margin-bottom:10px">Leere Felder verwenden den Standardpreis. Änderungen gelten nur für dieses Fahrzeug.</div>${db.services.map(s=>{let o=overrides[s.id]||{};return `<div class="costrow" style="display:block"><b>${esc(s.name)}</b><div class="grid g2" style="margin-top:7px"><label class="field"><span>Verkaufspreis (€)</span><input type="number" step="0.01" class="voprice" data-service="${s.id}" placeholder="Standard ${s.price}" value="${o.price??''}"></label><label class="field"><span>Materialkosten (€)</span><input type="number" step="0.01" class="voparts" data-service="${s.id}" placeholder="Standard ${s.partsCost}" value="${o.partsCost??''}"></label></div></div>`}).join('')}</div><button class="btn primary" style="width:100%" onclick="saveVehicle('${vid}')">Speichern</button>`)}

function normalizeMaterialRow(row){let pick=(...keys)=>{for(let k of keys){let found=Object.keys(row).find(x=>x.trim().toLowerCase()===k.toLowerCase());if(found!==undefined&&String(row[found]??'').trim()!=='')return String(row[found]).trim()}return ''},costRaw=pick('Kosten je Einheit','Kosten','Einstandspreis','unitCost','cost','price').replace(/\s/g,'').replace('€','').replace(',','.');return {id:id(),name:pick('Bezeichnung','Material','Name','name'),manufacturer:pick('Hersteller','Marke','manufacturer','brand'),partNumber:pick('Teilenummer','Artikelnummer','OEM','partNumber','part_number'),approval:pick('Freigabe','Spezifikation','Norm','approval','specification'),unit:pick('Einheit','unit')||'Stück',unitCost:Number(costRaw||0)}}
function parseMaterialCsv(text){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw new Error('Die CSV-Datei enthält keine Datensätze.');let delimiter=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',',parse=line=>{let out=[],cur='',quoted=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')quoted=!quoted;else if(ch===delimiter&&!quoted){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out},headers=parse(lines[0]).map(x=>x.trim());return lines.slice(1).map(line=>{let vals=parse(line),o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o})}
function importMaterialsFile(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let raw;if(file.name.toLowerCase().endsWith('.json')){let parsed=JSON.parse(reader.result);raw=Array.isArray(parsed)?parsed:(parsed.materials||[])}else raw=parseMaterialCsv(reader.result);let converted=raw.map(normalizeMaterialRow),valid=converted.filter(m=>m.name),invalid=converted.length-valid.length,duplicates=valid.filter(m=>(db.materials||[]).some(x=>(x.name||'').toLowerCase()===m.name.toLowerCase()&&String(x.partNumber||'').toLowerCase()===String(m.partNumber||'').toLowerCase())).length;if(!valid.length)throw new Error('Keine gültigen Materialien gefunden. Benötigt wird mindestens eine Spalte „Bezeichnung“ oder „Name“.');showMaterialImportPreview(valid,invalid,duplicates)}catch(err){alert('Materialimport fehlgeschlagen: '+err.message)}};reader.readAsText(file,'UTF-8')}
function showMaterialImportPreview(items,invalid,duplicates){window.pendingMaterialImport=items;showModal('Materialimport prüfen',`<div class="notice"><b>${items.length}</b> gültige Materialien erkannt.<br><b>${duplicates}</b> mögliche Duplikate.<br><b>${invalid}</b> ungültige Zeilen werden übersprungen.</div><div class="card" style="max-height:40vh;overflow:auto;box-shadow:none;border:1px solid #dbe2ea">${items.slice(0,50).map(m=>`<div class="costrow"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.manufacturer||'')} ${m.partNumber?'· '+esc(m.partNumber):''} ${m.approval?'· '+esc(m.approval):''}</div></div><span>${euro(m.unitCost)} / ${esc(m.unit)}</span></div>`).join('')}${items.length>50?`<div class="muted">Weitere ${items.length-50} Datensätze werden ebenfalls importiert.</div>`:''}</div><label class="field"><span>Umgang mit vorhandenen Materialien</span><select id="materialImportMode"><option value="skip">Duplikate überspringen</option><option value="update">Vorhandene Materialien aktualisieren</option><option value="add">Trotzdem als neue Materialien hinzufügen</option></select></label><button class="btn primary" style="width:100%" onclick="applyMaterialImport()">Import durchführen</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Abbrechen</button>`)}
function applyMaterialImport(){let items=window.pendingMaterialImport||[],mode=materialImportMode.value,current=[...(db.materials||[])],added=0,updated=0,skipped=0;items.forEach(m=>{let i=current.findIndex(x=>(x.name||'').toLowerCase()===m.name.toLowerCase()&&String(x.partNumber||'').toLowerCase()===String(m.partNumber||'').toLowerCase());if(i>=0&&mode==='skip'){skipped++;return}if(i>=0&&mode==='update'){current[i]={...current[i],...m,id:current[i].id};updated++;return}current.push({...m,id:id()});added++});db.materials=current;delete window.pendingMaterialImport;save();closeModal();alert(`Materialimport abgeschlossen.\nNeu: ${added}\nAktualisiert: ${updated}\nÜbersprungen: ${skipped}`)}

function editEntry(){if(!db.vehicles.length)return alert('Bitte zuerst ein Fahrzeug anlegen.');showEntry(db.vehicles[0].id)} function showEntry(vid){let v=vehicle(vid),own=v.type==='own';showModal(own?'Materialkosten eigenes Fahrzeug':'Kundenauftrag',`<label class="field"><span>Fahrzeug</span><select id="evehicle" onchange="showEntry(this.value)">${db.vehicles.map(x=>`<option value="${x.id}" ${x.id===vid?'selected':''}>${esc(x.make)} ${esc(x.model)} · ${x.type==='own'?'Eigenes Fahrzeug':esc(customer(x.customerId)?.name||'')}</option>`).join('')}</select></label>${own?`<label class="field"><span>Kostenkategorie</span><select id="ecat">${db.costCategories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`:''}<h3>Leistungen</h3>${db.services.map(s=>{let amount=serviceValue(v,s,own?'partsCost':'price');return `<label class="check"><input type="checkbox" class="svc" value="${s.id}"><span style="flex:1"><b>${esc(s.name)}</b></span><input type="number" step="0.01" class="entryprice" data-service="${s.id}" value="${amount}" style="width:105px;text-align:right"></label>`}).join('')}<div class="card" style="box-shadow:none;border:1px solid #dbe2ea"><h3>Verwendete Materialien</h3><div class="muted" style="margin-bottom:10px">Hersteller, Teilenummer, Freigabe, Menge und tatsächliche Kosten werden in der Fahrzeughistorie gespeichert.</div>${(db.materials||[]).map(m=>`<div class="costrow" style="display:block"><label class="check" style="padding:0"><input type="checkbox" class="matcheck" value="${m.id}"><span><b>${esc(m.name)}</b><small class="muted" style="display:block">${esc(m.manufacturer||'')} ${m.partNumber?'· '+esc(m.partNumber):''} ${m.approval?'· '+esc(m.approval):''}</small></span></label><div class="grid g2"><label class="field"><span>Menge (${esc(m.unit)})</span><input type="number" step="0.01" class="matqty" data-material="${m.id}" value="1"></label><label class="field"><span>Kosten je Einheit (€)</span><input type="number" step="0. function saveEntry(vid){let v=vehicle(vid),own=v.type==='own',checked=[...document.querySelectorAll('.svc:checked')],usedMaterials=[...document.querySelectorAll('.matcheck:checked')].map(cb=>{let m=(db.materials||[]).find(x=>x.id===cb.value),qty=Number(document.querySelector(`.matqty[data-material="${cb.value}"]`).value||0),unitCost=Number(document.querySelector(`.matcost[data-material="${cb.value}"]`).value||0);return {materialId:m.id,name:m.name,manufacturer:m.manufacturer,partNumber:m.partNumber,approval:m.approval,unit:m.unit,quantity:qty,unitCost,total:qty*unitCost}});if(!checked.length&&!usedMaterials.length)return alert('Bitte mindestens eine Leistung oder ein Material auswählen.');let items=checked.map(cb=>{let service=db.services.find(x=>x.id===cb.value),input=document.querySelector(`.entryprice[data-service="${cb.value}"]`);return {serviceId:service.id,name:service.name,price:Number(input.value||0),partsCost:serviceValue(v,service,'partsCost')}}),serviceTotal=items.reduce((a,x)=>a+x.price,0),serviceParts=items.reduce((a,x)=>a+x.partsCost,0),materialTotal=usedMaterials.reduce((a,x)=>a+x.total,0),partsCost=materialTotal||serviceParts,entry={id:id(),date:todayISO(),vehicleId:vid,type:v.type,serviceIds:items.map(x=>x.serviceId),items,materials:usedMaterials,partsCost};if(own){entry.costCategoryId=ecat.value;entry.ownCost=partsCost}else{let labor=(+eh.value+(+em.value/60))*+er.value;entry.total=Math.max(0,serviceTotal+labor+ +emark.value- +edisc.value);entry.profit=entry.total-partsCost;entry.text=`Hallo ${customer(v.customerId)?.name||''},\n\nfür Ihren ${v.make} ${v.model} habe ich folgendes Angebot erstellt:\n\n${items.map(x=>'• '+x.name+': '+euro(x.price)).join('\n')}\n\nGesamtpreis: ${euro(entry.total)}\n\nViele Grüße\n${db.settings.company}`}db.entries.push(entry);save();closeModal()}

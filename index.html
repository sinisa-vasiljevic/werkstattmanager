<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b63ce"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Werkstatt"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Werkstattmanager</title>
<style>
:root{--b:#0b63ce;--bg:#eef2f7;--card:#fff;--txt:#111827;--mut:#64748b;--red:#dc2626;--green:#059669;--vio:#6d28d9;--amber:#d97706}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:84px}header{position:sticky;top:0;z-index:20;background:#07111ff2;color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 14px #0003}header small{color:#60a5fa;font-weight:800;letter-spacing:.12em}h1{font-size:20px;margin:2px 0}.wrap{max-width:900px;margin:auto;padding:16px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:1px solid #dbe2ea;padding-bottom:env(safe-area-inset-bottom)}.tab{border:0;background:none;padding:9px 2px;font-size:10px;color:#64748b}.tab b{display:block;font-size:19px}.tab.on{color:var(--b)}button{font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:#e7edf5;color:#1e293b}.primary{background:var(--b);color:#fff}.danger{background:#fee2e2;color:#991b1b}.wa{background:#10b981;color:white}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 12px #0f172a0d;margin-bottom:12px}.card h3{margin:0 0 5px}.muted{color:var(--mut);font-size:13px}.big{font-size:24px;font-weight:850}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.own{background:#ef4444;color:#fff}.cust{background:#39ff14;color:#07111f}.field{display:block;margin-bottom:12px}.field span{display:block;font-size:12px;font-weight:750;color:#475569;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px;background:white;font-size:16px}textarea{min-height:80px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:5px 0 12px}.section-title>.row{flex-wrap:wrap}.section-title .btn{max-width:100%}.section-title h2{margin:0}.hide{display:none!important}.modal{position:fixed;inset:0;z-index:50;background:#02061799;display:flex;align-items:flex-end}.sheet{background:#f8fafc;width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;background:#f8fafc;padding:4px 0 14px;z-index:2}.sheet-head h2{margin:0;line-height:1.15;max-width:calc(100% - 52px);overflow-wrap:anywhere}.x{border:0;background:#e2e8f0;border-radius:50%;width:36px;height:36px;font-size:20px}.tuv{border-left:5px solid}.black{border-color:#111827;background:#f1f5f9}.red{border-color:#ef4444;background:#fef2f2}.yellow{border-color:#f59e0b;background:#fffbeb}.green{border-color:#10b981;background:#ecfdf5}.search{margin-bottom:12px}.line{border-top:1px solid #e2e8f0;margin:12px 0}.check{display:flex;align-items:center;gap:10px;padding:12px;background:white;border-radius:12px;margin-bottom:7px}.check input{width:22px;height:22px}.notice{padding:12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:13px}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.costrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e2e8f0}.costrow:last-child{border:0}.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.material-head{min-width:0;flex:1}.material-actions{display:flex;gap:8px;flex-wrap:wrap}.material-actions .btn{white-space:nowrap}.vehicle-data{display:grid;grid-template-columns:minmax(116px,auto) 1fr;gap:7px 12px;font-size:14px}.vehicle-data b{white-space:nowrap}@media(max-width:430px){.material-actions{width:100%}.material-actions>*{flex:1}.vehicle-data{grid-template-columns:1fr}.vehicle-data b{margin-top:5px}}@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.sheet{max-width:650px;margin:auto;border-radius:24px}.modal{align-items:center;padding:18px}.tabs{position:sticky;bottom:0;max-width:900px;margin:auto;border-radius:16px 16px 0 0}}
.family{background:#ffd400;color:#111827}
</style></head><body><header><div><div style="display:flex;align-items:baseline;gap:7px;white-space:nowrap"><small>WERKSTATTMANAGER</small><span style="font-size:10px;font-weight:700;color:#fff;letter-spacing:.04em">v 4.3.6</span></div><h1 id="companyTitle">Meine Werkstatt</h1></div><button class="btn primary" onclick="openQuick()">＋ Neu</button></header><main class="wrap" id="app"></main><nav class="tabs" id="tabs"></nav><div id="modal"></div>
<script>
const KEY='werkstattmanager-pwa-v1';
const defaults={settings:{company:'Meine Werkstatt',hourlyRate:50,dueWindow:90,redDays:14,yellowDays:60,rounding:'none'},vehicleClasses:[{id:'vc_small',name:'Kleinwagen',hourlyRate:60,order:1},{id:'vc_compact',name:'Kompaktklasse',hourlyRate:65,order:2},{id:'vc_mid',name:'Mittelklasse',hourlyRate:70,order:3},{id:'vc_upper',name:'Oberklasse',hourlyRate:80,order:4},{id:'vc_suv',name:'SUV',hourlyRate:85,order:5},{id:'vc_van',name:'Van',hourlyRate:75,order:6},{id:'vc_transporter',name:'Transporter',hourlyRate:95,order:7},{id:'vc_other',name:'Sonstiges',hourlyRate:70,order:8}],customers:[],vehicles:[],categories:[{id:'cat_service',name:'Service'},{id:'cat_bremsen',name:'Bremsen'}],services:[{id:'s_oel',categoryId:'cat_service',name:'Ölwechsel mit Filter',price:70,partsCost:42},{id:'s_luft',categoryId:'cat_service',name:'Luftfilterwechsel',price:15,partsCost:8}],materials:[{id:'mat_oel',name:'Motoröl 5W-30',manufacturer:'',partNumber:'',approval:'VW 504 00 / 507 00',unit:'Liter',unitCost:10.99},{id:'mat_oelfilter',name:'Ölfilter',manufacturer:'MANN-FILTER',partNumber:'',approval:'',unit:'Stück',unitCost:9.50}],costCategories:[{id:'cc_service',name:'Service & Wartung'},{id:'cc_rep',name:'Reparatur'},{id:'cc_tuv',name:'TÜV / HU'},{id:'cc_reifen',name:'Reifen'},{id:'cc_vers',name:'Versicherung'},{id:'cc_steuer',name:'Kfz-Steuer'},{id:'cc_pflege',name:'Pflege & Zubehör'},{id:'cc_sonst',name:'Sonstiges'}],entries:[]};
let db=load(),tab='dash',vehicleFilter='all'; const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7); const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0)); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const todayISO=()=>{const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}; const monthValue=d=>d?String(d).slice(0,7):''; const monthEnd=m=>{if(!m)return '';const [y,mo]=m.split('-').map(Number),d=new Date(y,mo,0);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const serviceValue=(v,s,key)=>{const val=v?.priceOverrides?.[s.id]?.[key];return val===null||val===undefined||val===''?Number(s[key]||0):Number(val)};
const cleanPhone=value=>{let p=String(value||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='49'+p.slice(1);return p};
const digitsOnly=value=>String(value??'').replace(/\D/g,'');
const formatKm=value=>{const d=digitsOnly(value);return d?new Intl.NumberFormat('de-DE').format(Number(d)):''};
const formatDateDE=value=>value?new Date(value+'T00:00:00').toLocaleDateString('de-DE'):'–';
const formatTuvMonth=value=>value?new Date(value+'T00:00:00').toLocaleDateString('de-DE',{month:'2-digit',year:'numeric'}):'–';
function formatKmInput(el){el.value=formatKm(el.value)}
function syncPower(source){let kw=document.getElementById('vkw'),ps=document.getElementById('vps');if(!kw||!ps)return;if(source==='kw')ps.value=kw.value===''?'':Math.round(Number(kw.value)*1.35962);else kw.value=ps.value===''?'':Math.round(Number(ps.value)*0.735499)}
function prepFirstRegistration(){let el=document.getElementById('vfirstreg'),year=document.getElementById('vyear')?.value.trim();if(el&&!el.value&&/^\d{4}$/.test(year))el.value=year+'-01-01'}
function load(){try{let saved=JSON.parse(localStorage.getItem(KEY)||'{}'),data={...structuredClone(defaults),...saved,settings:{...defaults.settings,...(saved.settings||{})}};data.vehicleClasses=(data.vehicleClasses?.length?data.vehicleClasses:structuredClone(defaults.vehicleClasses)).sort((a,b)=>(a.order||0)-(b.order||0));data.services=(data.services||[]).map(x=>{let base=Number(x.laborMinutes||45),mat=Number(x.partsCost||0);return {...x,laborMinutes:base,classTimes:x.classTimes||Object.fromEntries(data.vehicleClasses.map(c=>[c.id,base])),classMaterial:x.classMaterial||Object.fromEntries(data.vehicleClasses.map(c=>[c.id,mat]))}});data.costCategories=(data.costCategories||[]).map(c=>c.name==='TÜV & AU'?{...c,name:'TÜV / HU'}:c);return data}catch{return structuredClone(defaults)}} function save(){localStorage.setItem(KEY,JSON.stringify(db));document.querySelector('#companyTitle').textContent=db.settings.company;render()};
const tabs=[['dash','⌂','Übersicht'],['customers','♙','Kunden'],['vehicles','▣','Fahrzeuge'],['services','🔧','Leistungen'],['orders','▤','Aufträge'],['costs','▥','Kosten'],['settings','⚙','Optionen']];
function render(){document.querySelector('#companyTitle').textContent=db.settings.company;document.querySelector('#tabs').innerHTML=tabs.map(x=>`<button class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelector('#app').innerHTML=({dash:dashboard,customers:customersPage,vehicles:vehiclesPage,services:servicesPage,orders:ordersPage,costs:costsPage,settings:settingsPage}[tab])();}
function customer(cid){return db.customers.find(x=>x.id===cid)} function vehicle(vid){return db.vehicles.find(x=>x.id===vid)} function category(cid){return db.costCategories.find(x=>x.id===cid)}
function daysUntil(d){if(!d)return null;let a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(d+'T00:00:00')-a)/86400000)}
function dashboard(){let cfg=db.settings,due=db.vehicles.map(v=>({...v,days:daysUntil(v.tuv)})).filter(v=>v.days!==null&&v.days<=Number(cfg.dueWindow)).sort((a,b)=>a.days-b.days),own=db.vehicles.filter(v=>v.type==='own').length;return `<div class="grid g4">${stat('Kunden',db.customers.length)}${stat('Eigene Fzg.',own)}${stat('Kunden-Fzg.',db.vehicles.length-own)}${stat('TÜV fällig',due.length)}</div><div class="section-title"><div><h2>TÜV bald fällig</h2><div class="muted">Nächste ${cfg.dueWindow} Tage · Grenzen unter Optionen</div></div></div>${due.length?due.map(v=>{let c=customer(v.customerId),cl=v.days<0?'black':v.days<=Number(cfg.redDays)?'red':v.days<=Number(cfg.yellowDays)?'yellow':'green',dot=v.days<0?'⚫':v.days<=Number(cfg.redDays)?'🔴':v.days<=Number(cfg.yellowDays)?'🟡':'🟢',txt=v.days<0?`seit ${Math.abs(v.days)} Tagen abgelaufen`:v.days===0?'heute fällig':`in ${v.days} Tagen`;return `<div class="card tuv ${cl}"><h3>${dot} ${esc(v.make)} ${esc(v.model)}</h3><div class="muted">(${v.type==='own'?'Eigenes Fahrzeug':esc(c?.name||'Kein Kunde')})</div><p><b>TÜV ${txt}</b></p><div class="muted">${esc(v.plate||'Kein Kennzeichen')} · ${new Date(v.tuv+'T00:00:00').toLocaleDateString('de-DE')}</div>${v.type!=='own'&&c?.phone?`<button class="btn wa" style="margin-top:12px" onclick="sendTuv('${v.id}')">WhatsApp</button>`:''}</div>`}).join(''):'<div class="card muted">Kein TÜV im gewählten Zeitraum.</div>'}`}
function stat(l,n){return `<div class="card"><div class="big">${n}</div><div class="muted"><b>${l}</b></div></div>`}
function customersPage(){return `<div class="section-title"><h2>Kunden</h2><button class="btn primary" onclick="editCustomer()">＋ Kunde</button></div><input class="search" id="search" placeholder="Kunde suchen" oninput="filterCards(this.value)"><div id="cardlist">${db.customers.map(c=>`<div class="card searchable"><div class="row between"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.phone||'Keine Telefonnummer')}</div><div class="muted">${db.vehicles.filter(v=>v.customerId===c.id&&v.type!=='own').length} Fahrzeug(e)</div></div><button class="btn" onclick="editCustomer('${c.id}')">Bearbeiten</button></div></div>`).join('')||'<div class="card muted">Noch keine Kunden.</div>'}</div>`}
function vehiclesPage(){let list=db.vehicles.filter(v=>vehicleFilter==='all'||v.type===vehicleFilter);return `<div class="section-title"><h2>Fahrzeuge</h2><button class="btn primary" onclick="editVehicle()">＋ Fahrzeug</button></div><div class="grid g3" style="margin-bottom:12px">${[['all','Alle'],['own','Eigene'],['customer','Kunden-Fzg.']].map(x=>`<button class="btn ${vehicleFilter===x[0]?'primary':''}" onclick="vehicleFilter='${x[0]}';render()">${x[1]}</button>`).join('')}</div><input class="search" placeholder="Fahrzeug suchen" oninput="filterCards(this.value)"><div id="cardlist" class="grid">${list.map(v=>`<div class="card searchable"><span class="pill ${v.type==='own'?'own':'cust'}">${v.type==='own'?'Eigenes Fahrzeug':'Kundenfahrzeug'}</span><h3 style="font-size:22px;margin-top:8px">${esc(v.make)} ${esc(v.model)}</h3><div class="muted" style="margin-bottom:12px">${v.type==='own'?'Eigener Bestand':esc(customer(v.customerId)?.name||'Kein Kunde')}</div><div class="vehicle-data"><b>Kennzeichen:</b><span>${esc(v.plate||'–')}</span><b>Erstzulassung:</b><span>${formatDateDE(v.firstRegistration)}</span><b>HSN:</b><span>${esc(v.hsn||'–')}</span><b>TSN:</b><span>${esc(v.tsn||'–')}</span><b>Kilometerstand:</b><span>${formatKm(v.mileage)||'–'}${v.mileage?' km':''}</span><b>Motor:</b><span>${esc(v.engine||'–')}</span><b>Leistung:</b><span>${v.powerKw||v.powerPs?`${esc(v.powerKw||'–')} kW / ${esc(v.powerPs||'–')} PS`:'–'}</span><b>Fahrzeugkategorie:</b><span>${esc(db.vehicleClasses.find(c=>c.id===v.vehicleClassId)?.name||'–')}</span><b>Ölmenge:</b><span>${v.oilCapacity?esc(v.oilCapacity)+' Liter':'–'}</span><b>TÜV/HU:</b><span>${formatTuvMonth(v.tuv)}</span></div><button class="btn" style="margin-top:16px;width:100%" onclick="editVehicle('${v.id}')">Bearbeiten</button></div>`).join('')||'<div class="card muted">Keine Fahrzeuge.</div>'}</div>`}
function servicesPage(){return `<div class="section-title"><div><h2>Leistungen</h2><div class="muted">Preise, Teilekosten und feste Arbeitszeiten</div></div><button class="btn" onclick="editServiceCategory()">＋ Kategorie</button></div>${db.categories.map(c=>`<div class="card"><div class="row between"><h3>${esc(c.name)}</h3><button class="btn primary" onclick="editService('', '${c.id}')">＋</button></div><div class="line"></div>${db.services.filter(x=>x.categoryId===c.id).map(x=>`<div class="costrow"><div><b>${esc(x.name)}</b><div class="muted">VK ${euro(x.price)} · Teile ${euro(x.partsCost)} · Zeit ${Math.floor(Number(x.laborMinutes||0)/60)} Std. ${Number(x.laborMinutes||0)%60} Min.</div></div><button class="btn" onclick="editService('${x.id}')">Bearbeiten</button></div>`).join('')||'<div class="muted">Keine Leistungen.</div>'}</div>`).join('')}<div class="section-title"><div class="material-head"><h2>Materialdatenbank</h2><div class="muted">Öle, Filter, Teile und Freigaben</div></div><div class="material-actions"><button class="btn" onclick="exportMaterialTemplate()">CSV-Vorlage</button><label class="btn">Import<input type="file" accept=".csv,.json,text/csv,application/json" hidden onchange="importMaterialsFile(this.files[0]);this.value='' "></label><button class="btn primary" onclick="editMaterial()">＋ Material</button></div></div>${(db.materials||[]).map(m=>`<div class="card"><div class="row between"><div><h3>${esc(m.name)}</h3><div class="muted">${esc(m.manufacturer||'Kein Hersteller')}${m.partNumber?' · '+esc(m.partNumber):''}</div><div class="muted">${m.approval?'Freigabe: '+esc(m.approval)+' · ':''}${euro(m.unitCost)} / ${esc(m.unit||'Stück')}</div></div><button class="btn" onclick="editMaterial('${m.id}')">Bearbeiten</button></div></div>`).join('')||'<div class="card muted">Noch keine Materialien angelegt.</div>'}`}
function ordersPage(){return `<div class="section-title"><div><h2>Aufträge & Kosten</h2><div class="muted">Kundenumsatz und eigene Fahrzeugkosten</div></div><button class="btn primary" onclick="editEntry()">＋ Neu</button></div>${db.entries.slice().reverse().map(e=>{let v=vehicle(e.vehicleId),own=e.type==='own',cat=category(e.costCategoryId);return `<div class="card"><span class="pill ${own?'own':'cust'}">${own?(cat?.name||'Eigene Kosten'):'Kundenauftrag'}</span><h3>${esc(v?.make||'Fahrzeug gelöscht')} ${esc(v?.model||'')}</h3><div class="muted">${own?'Eigenes Fahrzeug':esc(customer(v?.customerId)?.name||'Kein Kunde')} · ${new Date(e.date+'T00:00:00').toLocaleDateString('de-DE')}</div><div class="big" style="margin-top:10px">${euro(own?e.ownCost:e.total)}</div>${e.totalMinutes?`<div class="muted">Gesamtzeit: ${Math.floor(e.totalMinutes/60)} Std. ${e.totalMinutes%60} Min.</div>`:''}${e.materials?.length?`<div class="line"></div><div class="muted"><b>Materialien:</b><br>${e.materials.map(m=>`${esc(m.name)} · ${esc(m.manufacturer||'')} ${m.partNumber?'· '+esc(m.partNumber):''} ${m.approval?'· '+esc(m.approval):''} · ${m.quantity} ${esc(m.unit)} · ${euro(m.total)}`).join('<br>')}</div>`:''}${!own?`<div class="muted" style="color:var(--green)">Ertrag: ${euro(e.profit)}</div>`:''}<div class="order-actions"><button class="btn" onclick="editEntry('${e.id}')">Bearbeiten</button>${!own?`<button class="btn wa" onclick="sendOffer('${e.id}')">WhatsApp</button>`:'<span></span>'}</div></div>`}).join('')||'<div class="card muted">Noch keine Einträge.</div>'}`}
function costsPage(){let own=db.entries.filter(e=>e.type==='own'),cust=db.entries.filter(e=>e.type!=='own'),rev=cust.reduce((a,e)=>a+e.total,0),parts=cust.reduce((a,e)=>a+e.partsCost,0),prof=cust.reduce((a,e)=>a+e.profit,0),ownTotal=own.reduce((a,e)=>a+e.ownCost,0);let cats=db.costCategories.map(c=>({c,total:own.filter(e=>e.costCategoryId===c.id).reduce((a,e)=>a+e.ownCost,0),count:own.filter(e=>e.costCategoryId===c.id).length})).filter(x=>x.count).sort((a,b)=>b.total-a.total);return `<h2>Getrennte Kostenansicht</h2><div class="card"><h3 style="color:var(--b)">Kundenfahrzeuge</h3><div class="grid g3">${moneyStat('Umsatz',rev)}${moneyStat('Teile',parts)}${moneyStat('Ertrag',prof)}</div></div><div class="card"><h3 style="color:var(--vio)">Meine Fahrzeuge</h3><div class="grid g2">${moneyStat('Einträge',own.length,true)}${moneyStat('Gesamtkosten',ownTotal)}</div></div><div class="card"><h3>Kosten nach Kategorien</h3>${cats.map(x=>`<div class="costrow"><div><b>${esc(x.c.name)}</b><div class="muted">${x.count} Einträge</div></div><b>${euro(x.total)}</b></div>`).join('')||'<div class="muted">Noch keine kategorisierten Kosten.</div>'}</div>${db.vehicles.filter(v=>v.type==='own').map(v=>{let es=own.filter(e=>e.vehicleId===v.id);return `<div class="card"><div class="muted" style="color:var(--vio)"><b>EIGENES FAHRZEUG</b></div><h3>${esc(v.make)} ${esc(v.model)}</h3><div class="muted">${es.length} Einträge</div><div class="big">${euro(es.reduce((a,e)=>a+e.ownCost,0))}</div></div>`}).join('')}`}
function moneyStat(l,n,count=false){return `<div class="notice"><div class="muted">${l}</div><b>${count?n:euro(n)}</b></div>`}

function importPracticeDb(file){if(!file)return;let fr=new FileReader();fr.onload=()=>{try{let data=JSON.parse(fr.result),arr=Array.isArray(data)?data:data.practiceTypes;if(!Array.isArray(arr))throw Error('Keine Datensätze');let existing=new Map(db.practiceTypes.map(x=>[x.id,x])),newCount=arr.filter(x=>!existing.has(x.id)).length,changed=arr.filter(x=>existing.has(x.id)&&JSON.stringify(existing.get(x.id))!==JSON.stringify(x)).length;if(!confirm(`Import prüfen\n\nNeue Datensätze: ${newCount}\nGeänderte Datensätze: ${changed}\n\nVorhandene Datensätze können ersetzt werden. Fortfahren?`))return;if(!confirm('Import endgültig durchführen? Bereits bestätigte Fahrzeugwerte bleiben unverändert.'))return;arr.forEach(x=>existing.set(x.id,x));db.practiceTypes=[...existing.values()];save();alert('Praxisdatenbank importiert.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};fr.readAsText(file,'UTF-8')}

function editVehicle41(vid='',presetCustomerId=''){let v=db.vehicles.find(x=>x.id===vid)||{type:'customer',customerId:presetCustomerId,technical:{},technicalMeta:{}},t=v.technical||{},choices=db.practiceTypes.map(practiceLabel);showModal(v.id?'Fahrzeug bearbeiten':'Fahrzeug anlegen',`<input type="hidden" id="vtype" value="${v.type||'customer'}"><input type="hidden" id="vpracticeid" value="${esc(v.technicalMeta?.practiceId||'')}"><div class="grid g2"><button id="vc" class="btn ${v.type!=='own'?'primary':''}" onclick="setVehicleType('customer')">Kundenfahrzeug</button><button id="vo" class="btn ${v.type==='own'?'primary':''}" onclick="setVehicleType('own')">Eigenes Fahrzeug</button></div><div id="customerField" class="${v.type==='own'?'hide':''}"><label class="field"><span>Kunde</span><select id="vcustomer"><option value="">Bitte auswählen</option>${db.customers.map(c=>`<option value="${c.id}" ${v.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div><div class="card"><h3>Praxisdatenbank durchsuchen</h3><input id="vpractice" list="vehiclePracticeList" placeholder="Hersteller, Modell, Baureihe, Motorcode"><datalist id="vehiclePracticeList">${choices.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist><button class="btn" style="width:100%;margin-top:8px" onclick="previewVehicleData()">Vorschlag anzeigen</button><div id="practicePreview"></div></div><label class="field"><span>Fahrzeugkategorie</span><select id="vclass"><option value="">Bitte auswählen</option>${db.vehicleClasses.map(c=>`<option value="${c.id}" ${v.vehicleClassId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class="grid g2"><label class="field"><span>Hersteller</span><input id="vmake" value="${esc(v.make||'')}"></label><label class="field"><span>Modell</span><input id="vmodel" value="${esc(v.model||'')}"></label></div><div class="grid g2"><label class="field"><span>Baureihe</span><input id="vseries" value="${esc(v.series|| function saveVehicle41(vid=''){if(!vmake.value.trim()||!vmodel.value.trim())return alert('Hersteller und Modell fehlen.');if(vtype.value==='customer'&&!vcustomer.value)return alert('Bitte Kunde wählen.');if(!vclass.value)return alert('Bitte Fahrzeugkategorie wählen.');let old=db.vehicles.find(x=>x.id===vid)||{},practice=db.practiceTypes.find(x=>x.id===vpracticeid.value),o={...old,id:vid||Date.now().toString(36),type:vtype.value,customerId:vtype.value==='own'?'':vcustomer.value,vehicleClassId:vclass.value,make:vmake.value.trim(),model:vmodel.value.trim(),series:vseries.value.trim(),engine:vengine.value.trim(),engineCode:venginecode.value.trim().toUpperCase(),plate:vplate.value.trim().toUpperCase(),powerKw:vkw.value,powerPs:vps.value,year:vyear.value,firstRegistration:vfirstreg.value,mileage:digitsOnly(vkm.value),hsn:vhsn.value,tsn:vtsn.value.toUpperCase(),vin:vvin.value.toUpperCase(),tuv:monthEnd(vtuvmonth.value),oilCapacity:voil.value,technical:{oilViscosity:voilvisc.value.trim(),oilApproval:voilapproval.value.trim(),filters:{oil:voilfilter.value.trim(),air:vairfilter.value.trim(),cabin:vcabinfilter.value.trim(),fuel:vfuelfilter.value.trim()},notes:vtechnotes.value.split('\n').map(x=>x.trim()).filter(Boolean)},technicalMeta:{practiceId:vpracticeid.value,source:practice?'Praxisdatenbank':'Manuell',status:practice?'übernommen, sichtbar und noch zu bestätigen':'manuell'},notes:vnotes.value};if(!confirm(`${vid?'Fahrzeugänderungen':'Neues Fahrzeug'} speichern?\n\n${o.make} ${o.model} ${o.series}\n${o.engine} ${o.engineCode}\n\nAlle technischen Zuordnungen bleiben in den Fahrzeugdetails sichtbar.`))return;db.vehicles=vid?db.vehicles.map(x=>x.id===vid?o:x):[...db.vehicles,o];save();closeModal()}

function getVehicleLaborMinutes(v,service){return Number(v?.technical?.laborTimes?.[service.id]?.minutes??service.classTimes?.[v.vehicleClassId]??service.laborMinutes??0)}
function buildAiResearchPrompt(vid){let v=vehicle(vid),vc=db.vehicleClasses.find(c=>c.id===v.vehicleClassId),services=db.services.map(x=>({id:x.id,category:db.categories.find(c=>c.id===x.categoryId)?.name||'',name:x.name,currentFallbackMinutes:getVehicleLaborMinutes(v,x)}));return `Du recherchierst technische Fahrzeugdaten für eine private Werkstatt-PWA. Nutze aktuelle öffentlich zugängliche und möglichst fahrzeugspezifische Quellen. Bevorzuge offizielle Fahrzeugunterlagen, öffentlich zugängliche Ölwegweiser, Filter- und Teilekataloge sowie seriöse technische Quellen. Prüfe Angaben möglichst mit einer zweiten Quelle. Erfinde keine Werte. Wenn eine Zuordnung nicht eindeutig ist, verwende null und erkläre die Unsicherheit. Richtzeiten sind nur realistische Praxis-Schätzungen, keine Hersteller-AW.\n\nFAHRZEUG\nHersteller: ${v.make||''}\nModell: ${v.model||''}\nBaureihe: ${v.series||''}\nBaujahr: ${v.year||''}\nErstzulassung: ${v.firstRegistration||''}\nMotorisierung: ${v.engine||''}\nMotorcode: ${v.engineCode||'unbekannt'}\nLeistung: ${v.powerKw||''} kW / ${v.powerPs||''} PS\nKraftstoff: ${v.fuel||''}\nVIN: ${v.vin||'nicht angegeben'}\nHSN: ${v.hsn||'nicht angegeben'}\nTSN: ${v.tsn||'nicht angegeben'}\nFahrzeugkategorie: ${vc?.name||'unbekannt'}\n\nRECHERCHEUMFANG\n1. Identifikation und mögliche Motorcodes, wenn noch nicht eindeutig.\n2. Motoröl-Freigabe, geeignete Viskositäten und Füllmenge mit Filter.\n3. Ölfilter, Luftfilter, Innenraumfilter und Kraftstofffilter mit Hersteller und Teilenummer, aber nur wenn eindeutig.\n4. Technische Besonderheiten und relevante Hinweise.\n5. Praxis-Richtzeiten in Minuten für ALLE nachfolgenden Leistungen. Auch nicht gefundene Leistungen müssen in laborTimes enthalten sein, dann mit minutes:null.\n\nLEISTUNGEN AUS DER APP\n${services.map(x=>`- ID ${x.id} | ${x.category} | ${x.name} | bisheriger Rückfallwert ${x.currentFallbackMinutes} Minuten`).join('\n')}\n\nANTWORTFORMAT\nAntworte ausschließlich mit einem einzigen gültigen JSON-Objekt, ohne Markdown, ohne Codezaun und ohne zusätzlichen Text. Verwende exakt dieses Schema:\n${JSON.stringify({schemaVersion:1,vehicle:{manufacturer:null,model:null,series:null,year:null,engine:null,engineCode:null,powerKw:null,powerPs:null,fuel:null,vehicleClass:null,identificationConfidence:'low|medium|high'},engineOil:{approval:null,viscosities:[],capacityWithFilterLiters:null},filters:{oilFilter:{manufacturer:null,partNumber:null},airFilter:{manufacturer:null,partNumber:null},cabinFilter:{manufacturer:null,partNumber:null},fuelFilter:{manufacturer:null,partNumber:null}},technicalNotes:[],laborTimes:services.map(x=>({serviceId:x.id,serviceName:x.name,minutes:null,confidence:'low|medium|high',note:null})),uncertainties:[],sources:[{title:null,url:null,usedFor:[]}]},null,2)}\n\nWICHTIG\n- Behalte jede serviceId exakt bei.\n- Nutze Minuten als ganze Zahl.\n- Kennzeichne Unsicherheiten deutlich.\n- Gib keine angeblichen Hersteller-AW aus.\n- Wenn VIN oder HSN/TSN nicht öffentlich eindeutig dekodierbar sind, sage das in uncertainties und rate nicht.`}

async function pasteAiJson(){try{document.getElementById('aiJson').value=await navigator.clipboard.readText()}catch(e){alert('Direktes Einfügen ist auf diesem Gerät nicht erlaubt. Bitte im Feld gedrückt halten und „Einfügen“ wählen.') }}
function cleanAiJsonText(raw){let text=String(raw??'').trim();if(!text)throw Error('Die eingefügte Antwort ist leer.');text=text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let first=text.indexOf('{'),last=text.lastIndexOf('}');if(first>=0&&last>first)text=text.slice(first,last+1);text=text.replace(/\\\r?\n/g,'\n');text=text.replace(/\\(?!["\\/bfnrtu])/g,'');return text}
function extractJsonObject(raw){let cleaned=cleanAiJsonText(raw);let attempts=[cleaned];if(cleaned.includes('\\"'))attempts.push(cleaned.replace(/\\"/g,'"'));for(let text of attempts){try{return JSON.parse(text)}catch(e){}}let pos=0;try{JSON.parse(cleaned)}catch(e){let m=String(e.message).match(/position\s+(\d+)/i);if(m)pos=Number(m[1])}let near=cleaned.slice(Math.max(0,pos-45),pos+75).replace(/\s+/g,' ');throw Error('Das JSON ist nach der Bereinigung noch ungültig.'+(near?' Fehlerstelle: '+near:''))}
function normalizeAiResult(raw){let x=typeof raw==='string'?extractJsonObject(raw):raw;if(!x||Number(x.schemaVersion)!==1)throw Error('Schema-Version fehlt oder ist nicht 1.');x.vehicle=x.vehicle||{};x.engineOil=x.engineOil||{};x.filters=x.filters||{};x.technicalNotes=Array.isArray(x.technicalNotes)?x.technicalNotes:[];x.laborTimes=Array.isArray(x.laborTimes)?x.laborTimes:[];x.uncertainties=Array.isArray(x.uncertainties)?x.uncertainties:[];x.sources=Array.isArray(x.sources)?x.sources:[];let validIds=new Set(db.services.map(s=>s.id));x.laborTimes=x.laborTimes.filter(t=>validIds.has(t.serviceId)).map(t=>({...t,minutes:t.minutes===null?null:Math.max(0,Math.round(Number(t.minutes)||0))}));return x}
function reviewAiJson(vid){vid=vid||window.activeAiVehicleId;try{let data=normalizeAiResult(document.getElementById('aiJson').value),v=vehicle(vid);window.pendingAiImport={vid,data};let row=(key,label,oldVal,newVal,checked=true)=>`<label class="check"><input type="checkbox" class="aiField" data-key="${key}" ${checked&&newVal!==null&&newVal!==''?'checked':''}><span style="flex:1"><b>${label}</b><small class="muted" style="display:block">Vorhanden: ${esc(oldVal??'–')}<br>KI-Vorschlag: ${esc(newVal??'nicht gefunden')}</small></span></label>`;let f=data.filters||{},times=data.laborTimes.map(t=>{let svc=db.services.find(s=>s.id===t.serviceId),old=getVehicleLaborMinutes(v,svc);return `<label class="check"><input type="checkbox" class="aiTime" data-service="${t.serviceId}" ${t.minutes!==null?'checked':''}><span style="flex:1"><b>${esc(svc?.name||t.serviceName)}</b><small class="muted" style="display:block">Vorhanden/Rückfall: ${old} Min. · KI: ${t.minutes??'nicht gefunden'} Min. · Sicherheit: ${esc(t.confidence||'unbekannt')}</small></span></label>`}).join('');showModal('KI-Ergebnis prüfen',`<div class="notice">KI-Angaben können falsch sein. Wähle nur geprüfte Werte aus. Es ist noch nichts gespeichert.</div>${row('engineCode','Motorcode',v.engineCode,data.vehicle.engineCode)}${row('engine','Motorisierung',v.engine,data.vehicle.engine)}${row('power','Leistung',`${v.powerKw||'–'} kW / ${v.powerPs||'–'} PS`,`${data.vehicle.powerKw??'–'} kW / ${data.vehicle.powerPs??'–'} PS`)}${row('oilApproval','Ölfreigabe',v.technical?.oilApproval,data.engineOil.approval)}${row('viscosities','Viskositäten',v.technical?.oilViscosity,(data.engineOil.viscosities||[]).join(' / '))}${row('oilCapacity','Ölfüllmenge',v.oilCapacity,data.engineOil.capacityWithFilterLiters)}${row('oilFilter','Ölfilter',v.technical?.filters?.oil,formatAiPart(f.oilFilter))}${row('airFilter','Luftfilter',v.technical?.filters?.air,formatAiPart(f.airFilter))}${row('cabinFilter','Innenraumfilter',v.technical?.filters?.cabin,formatAiPart(f.cabinFilter))}${row('fuelFilter','Kraftstofffilter',v.technical?.filters?.fuel,formatAiPart(f.fuelFilter))}${row('notes','Technische Hinweise',(v.technical?.notes||[]).join('; '),data.technicalNotes.join('; '))}<details open><summary><b>Richtzeiten für alle Leistungen</b></summary><div class="card">${times||'<div class="muted">Keine passenden Richtzeiten in der Antwort.</div>'}</div></details>${data.uncertainties.length?`<div class="notice"><b>Unsicherheiten</b><br>${data.uncertainties.map(x=>'• '+esc(x)).join('<br>')}</div>`:''}${data.sources.length?`<details><summary><b>Quellen</b></summary><div class="card">${data.sources.map(x=>`<div>${esc(x.title||'Quelle')}<br><small>${esc(x.url||'')}</small></div>`).join('<div class="line"></div>')}</div></details>`:''}<label class="check"><input type="checkbox" id="aiAddPractice"><span>Nach Fahrzeugübernahme zusätzlich als Praxisdatensatz speichern</span></label><button class="btn primary" style="width:100%" onclick="applyAiImport()">Ausgewählte Werte übernehmen</button>`)}catch(e){alert('JSON konnte nicht geprüft werden: '+e.message)}}
function formatAiPart(p){if(!p)return '';return [p.manufacturer,p.partNumber].filter(Boolean).join(' ')}
function selectedAiKeys(){return new Set([...document.querySelectorAll('.aiField:checked')].map(x=>x.dataset.key))}
function applyAiImport(){let p=window.pendingAiImport;if(!p)return;let v=vehicle(p.vid),d=p.data,keys=selectedAiKeys(),chosenTimes=[...document.querySelectorAll('.aiTime:checked')].map(x=>x.dataset.service),changes=[];if(keys.has('engineCode')&&d.vehicle.engineCode)changes.push(`Motorcode: ${v.engineCode||'–'} → ${d.vehicle.engineCode}`);if(keys.has('oilApproval')&&d.engineOil.approval)changes.push(`Ölfreigabe: ${v.technical?.oilApproval||'–'} → ${d.engineOil.approval}`);changes.push(`Richtzeiten: ${chosenTimes.length} ausgewählt`);if(!confirm(`Ausgewählte KI-Daten in dieses Fahrzeug übernehmen?\n\n${v.make} ${v.model}\n\n${changes.join('\n')}\n\nVorhandene ausgewählte Werte werden ersetzt. Nicht ausgewählte Werte bleiben unverändert.`))return;let t=v.technical||{},filters={...(t.filters||{})},laborTimes={...(t.laborTimes||{})};if(keys.has('engineCode')&&d.vehicle.engineCode)v.engineCode=d.vehicle.engineCode;if(keys.has('engine')&&d.vehicle.engine)v.engine=d.vehicle.engine;if(keys.has('power')){if(d.vehicle.powerKw!==null)v.powerKw=d.vehicle.powerKw;if(d.vehicle.powerPs!==null)v.powerPs=d.vehicle.powerPs}if(keys.has('oilApproval')&&d.engineOil.approval)t.oilApproval=d.engineOil.approval;if(keys.has('viscosities')&&d.engineOil.viscosities?.length)t.oilViscosity=d.engineOil.viscosities.join(' / ');if(keys.has('oilCapacity')&&d.engineOil.capacityWithFilterLiters!==null)v.oilCapacity=d.engineOil.capacityWithFilterLiters;for(let k of ['oil','air','cabin','fuel']){let key=k+'Filter',val=formatAiPart(d.filters[key]);if(keys.has(key)&&val)filters[k]=val}if(keys.has('notes'))t.notes=d.technicalNotes;d.laborTimes.filter(x=>chosenTimes.includes(x.serviceId)&&x.minutes!==null).forEach(x=>laborTimes[x.serviceId]={minutes:x.minutes,confidence:x.confidence||'unknown',note:x.note||'',source:'KI-Recherche',importedAt:new Date().toISOString()});v.technical={...t,filters,laborTimes};v.technicalMeta={...(v.technicalMeta||{}),source:'KI-Recherche',status:'importiert, noch zu bestätigen',aiImportedAt:new Date().toISOString(),aiSources:d.sources,aiUncertainties:d.uncertainties};save();let add=document.getElementById('aiAddPractice')?.checked;if(add){if(!confirm('Die ausgewählten KI-Daten zusätzlich als Praxisdatensatz speichern?\n\nDiese Daten werden künftig bei ähnlichen Fahrzeugen vorgeschlagen. Bereits gespeicherte Fahrzeuge werden nicht verändert.'))return vehicleDetails(v.id);if(!confirm('Praxisdatensatz endgültig speichern? Bitte Fahrzeugidentifikation, Motorcode und technische Angaben vorher geprüft haben.'))return vehicleDetails(v.id);saveAiToPractice(v,d,chosenTimes)}vehicleDetails(v.id)}
function saveAiToPractice(v,d,chosenTimes){let existing=db.practiceTypes.find(x=>x.brand===v.make&&x.model===v.model&&x.series===v.series&&String(x.engineCode||'')===String(v.engineCode||'')),record={...(existing||{}),id:existing?.id||'ai_'+Date.now().toString(36),brand:v.make,model:v.model,series:v.series||'',yearFrom:Number(v.year||0)||null,yearTo:Number(v.year||0)||null,vehicleClassId:v.vehicleClassId,engine:v.engine||d.vehicle.engine||'',engineCode:v.engineCode||d.vehicle.engineCode||'',kw:Number(v.powerKw||d.vehicle.powerKw||0)||null,ps:Number(v.powerPs||d.vehicle.powerPs||0)||null,fuel:d.vehicle.fuel||'',oilApproval:v.technical?.oilApproval||'',viscosities:(v.technical?.oilViscosity||'').split('/').map(x=>x.trim()).filter(Boolean),oilCapacity:Number(v.oilCapacity||0)||null,filters:{...(v.technical?.filters||{})},notes:v.technical?.notes||[],times:Object.fromEntries(d.laborTimes.filter(x=>chosenTimes.includes(x.serviceId)&&x.minutes!==null).map(x=>[x.serviceId,x.minutes])),sources:d.sources||[],status:'KI-importiert, manuell zu bestätigen',lastChanged:new Date().toISOString()};db.practiceTypes=existing?db.practiceTypes.map(x=>x.id===existing.id?record:x):[...db.practiceTypes,record];save()}

function getLaborTimeInfo(v,service){
 const ai=v?.technical?.laborTimes?.[service.id];
 if(ai&&ai.minutes!==null&&ai.minutes!==undefined&&ai.minutes!=='')return {minutes:Math.max(0,Number(ai.minutes)||0),source:'KI-Richtzeit',confidence:ai.confidence||''};
 const cls=service?.classTimes?.[v?.vehicleClassId];
 if(cls!==null&&cls!==undefined&&cls!=='')return {minutes:Math.max(0,Number(cls)||0),source:'Rückfall Fahrzeugkategorie',confidence:''};
 if(service?.laborMinutes!==null&&service?.laborMinutes!==undefined)return {minutes:Math.max(0,Number(service.laborMinutes)||0),source:'Allgemeiner Rückfallwert',confidence:''};
 return {minutes:0,source:'Keine Richtzeit vorhanden',confidence:''};
}
getVehicleLaborMinutes=(v,s)=>getLaborTimeInfo(v,s).minutes;
function calcCustomerOrder(partsCost,totalMinutes,rate,percentDiscount,extraLaborDiscount,markup){
 const material=Math.max(0,Number(partsCost)||0),laborGross=Math.max(0,Number(totalMinutes)||0)/60*Math.max(0,Number(rate)||0);
 const pct=Math.min(100,Math.max(0,Number(percentDiscount)||0)),percentAmount=laborGross*pct/100;
 const requestedExtra=Math.max(0,Number(extraLaborDiscount)||0),extraLimited=Math.min(requestedExtra,Math.max(0,laborGross-percentAmount));
 const laborDiscount=Math.min(laborGross,percentAmount+extraLimited),laborNet=Math.max(0,laborGross-laborDiscount),safeMarkup=Math.max(0,Number(markup)||0);
 return {material,laborGross,percentDiscount:pct,percentDiscountAmount:percentAmount,extraLaborDiscount:extraLimited,laborDiscount,laborNet,markup:safeMarkup,total:material+laborNet+safeMarkup,profit:material+laborNet+safeMarkup-material};
}

cent.value,eextralabordiscount.value,emark.value);entry.rate=Math.max(0,Number(er.value)||0);entry.markup=calc.markup;entry.customerCategory=c?.customerCategory==='family'?'family':'customer';entry.laborDiscountPercent=calc.percentDiscount;entry.laborDiscountPercentAmount=calc.percentDiscountAmount;entry.extraLaborDiscount=calc.extraLaborDiscount;entry.laborDiscountTotal=calc.laborDiscount;entry.laborGross=calc.laborGross;entry.laborNet=calc.laborNet;entry.total=calc.total;entry.profit=calc.profit;entry.discount=undefined;entry.text=`Hallo ${c?.name||''},\n\nfür Ihren ${v.make} ${v.model} habe ich folgendes Angebot erstellt:\n\n${items.map(x=>'• '+x.name+' · '+x.laborMinutes+' Min. ('+x.laborSource+')').join('\n')}\n\nMaterialkosten: ${euro(partsCost)}\nArbeitskosten regulär: ${euro(calc.laborGross)}\nRabatt nur auf Arbeit: -${euro(calc.laborDiscount)}\nArbeitskosten nach Rabatt: ${euro(calc.laborNet)}\nAufschlag: ${euro(calc.markup)}\nGesamtpreis: ${euro(calc.total)}\n\nViele Grüße\n${db.settings.company}`}db.entries=eid?db.entries.map(x=>x.id===eid?entry:x):[...db.entries,entry];save();closeModal()};

/* v4.3.5: korrekte Materialmengen und einheitlicher Fahrzeugklassen-Stundensatz. */
function isEngineOilMaterial(m){
  const name=String(m?.name||'').trim().toLowerCase();
  const unit=String(m?.unit||'').trim().toLowerCase();
  return unit==='liter'&&(/motoröl|motoroel|motor oil|engine oil/.test(name))&&!/filter/.test(name);
}
function defaultMaterialQuantity(m,v){return isEngineOilMaterial(m)&&Number(v?.oilCapacity)>0?Number(v.oilCapacity):1}
function currentVehicleClassRate(v){
  const vc=db.vehicleClasses.find(x=>x.id===v?.vehicleClassId);
  const classRate=Number(vc?.hourlyRate);
  return Number.isFinite(classRate)&&classRate>=0?classRate:Math.max(0,Number(db.settings.hourlyRate)||0);
}
function laborRateNotice(v,old){
  const current=currentVehicleClassRate(v),saved=old?.rate;
  if(saved===undefined||saved===null||saved==='')return `<div class="notice"><b>Verwendeter Stundensatz:</b> ${euro(current)} / Std. · aktuelle Fahrzeugklasse ${esc(db.vehicleClasses.find(x=>x.id===v.vehicleClassId)?.name||'Standard')}</div>`;
  const previous=Number(saved)||0;
  return Math.abs(previous-current)>0.0001
    ?`<div class="notice error"><b>Stundensatz aktualisiert:</b><br>Im Auftrag gespeichert: ${euro(previous)} / Std.<br>Aktuelle Fahrzeugklasse: ${euro(current)} / Std.<br><b>Für die Neuberechnung wird der aktuelle Fahrzeugklassen-Stundensatz verwendet.</b></div>`
    :`<div class="notice"><b>Verwendeter Stundensatz:</b> ${euro(current)} / Std. · entspricht dem gespeicherten Auftrag.</div>`;
}

}
function deleteEntry(eid){const e=db.entries.find(x=>x.id===eid);if(!e)return;if(!confirm('Diesen Auftrag wirklich löschen?'))return;if(!confirm('Auftrag endgültig löschen? Diese Aktion kann nur über ein Backup rückgängig gemacht werden.'))return;db.entries=db.entries.filter(x=>x.id!==eid);save();closeModal()}
ordersPage=function(){return `<div class="section-title"><div><h2>Aufträge & Kosten</h2><div class="muted">Jeder Auftrag ist vollständig bearbeitbar und nachvollziehbar aufgeschlüsselt.</div></div><button class="btn primary" onclick="editEntry()">＋ Neu</button></div>${db.entries.slice().reverse().map(e=>{const v=vehicle(e.vehicleId),own=e.type==='own',cat=category(e.costCategoryId),pp=profitPresentation(e.profit),family=e.customerCategory==='family',items=e.items||[],materials=e.materials||[],materialTotal=Number(e.partsCost||0),direct=Number(e.directCost||0),legacyOwnExtra=own?Math.max(0,Number(e.ownCost||0)-materialTotal-direct):0;return `<div class="card"><span class="pill ${own?'own':family?'family':'cust'}">${own?(cat?.name||'Eigene Kosten'):family?'Familie':'Kundenauftrag'}</span><h3>${esc(v?.make||'Fahrzeug gelöscht')} ${esc(v?.model||'')}</h3><div class="muted">${own?'Eigenes Fahrzeug':esc(customer(v?.customerId)?.name||'Kein Kunde')} · ${new Date(e.date+'T00:00:00').toLocaleDateString('de-DE')}</div><div class="big" style="margin-top:10px">${euro(own?e.ownCost:e.total)}</div><div class="muted">Gesamtzeit: ${Math.floor(Number(e.totalMinutes||0)/60)} Std. ${Number(e.totalMinutes||0)%60} Min.${own?' · nur Dokumentation':''}</div><div class="line"></div><div><b>Leistungen:</b>${items.length?items.map(x=>`<div class="costrow"><span>${esc(x.name)}<small class="muted" style="display:block">${x.laborMinutes||0} Min. · ${esc(x.laborSource||'gespeichert')}</small></span><b>${own?euro(0):''}</b></div>`).join(''):'<div class="muted">Keine Leistung gespeichert.</div>'}</div>${own?`<div class="line"></div><div class="costrow"><span>Konkrete Materialien</span><b>${euro(materialTotal)}</b></div><div class="costrow"><span>Direkter Kosteneintrag${e.description?' · '+esc(e.description):''}</span><b>${euro(direct)}</b></div>${legacyOwnExtra?`<div class="costrow" style="color:var(--red)"><span>Alter, nicht aufgeschlüsselter Kostenanteil<br><small>Entfällt beim erneuten Speichern nach neuer Logik.</small></span><b>${euro(legacyOwnExtra)}</b></div>`:''}<div class="costrow"><span>Arbeitskosten eigenes Fahrzeug</span><b>${euro(0)}</b></div>`:`<div class="line"></div><div class="costrow"><span>Materialkosten</span><b>${euro(materialTotal)}</b></div><div class="costrow"><span>Stundensatz</span><b>${euro(e.rate||0)} / Std.</b></div><div class="costrow"><span>Arbeitskosten regulär</span><b>${euro(e.laborGross||0)}</b></div><div class="costrow"><span>Rabatt nur auf Arbeit</span><b>-${euro(e.laborDiscountTotal||0)}</b></div><div class="costrow"><span>Arbeitskosten nach Rabatt</span><b>${euro(e.laborNet||0)}</b></div>${e.markup?`<div class="costrow"><span>Aufschlag</span><b>${euro(e.markup)}</b></div>`:''}`}${materials.length?`<div class="line"></div><div class="muted"><b>Materialdetails:</b><br>${materials.map(m=>`${esc(m.name)} · ${m.quantity} ${esc(m.unit)} × ${euro(m.unitCost)} = ${euro(m.total)}`).join('<br>')}</div>`:''}${!own?`<div style="color:${pp.color};font-weight:800;margin-top:8px">${pp.label}: ${euro(e.profit)}</div>`:''}<div class="order-actions"><button class="btn" onclick="editEntry('${e.id}')">Vollständig bearbeiten</button>${!own?`<button class="btn wa" onclick="sendOffer('${e.id}')">WhatsApp</button>`:`<button class="btn danger" onclick="deleteEntry('${e.id}')">Löschen</button>`}</div></div>`}).join('')||'<div class="card muted">Noch keine Einträge.</div>'}`}

if('serviceWorker' in navigator){window.addEventListener('load',async()=>{let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload()});let reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});reg.update()})}render();
